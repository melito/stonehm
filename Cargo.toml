[package]
name = "stonehm"
version = "0.2.1"
edition = "2021"
description = "Automatic OpenAPI 3.0 generation for Axum applications"
license = "MIT"
repository = "https://github.com/melito/stonehm"
readme = "README.md"
keywords = ["openapi", "axum", "api", "documentation", "swagger"]
categories = ["web-programming", "api-bindings"]

[workspace]
members = ["examples/hello_world", "stonehm-macros"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
tower = "0.5"
tower-service = "0.3"
http = "1.0"
inventory = "0.3"
indexmap = "2.0"
serde_json = "1.0"

# Macros crate. Path dep during development so changes to the proc-macro
# take effect locally without re-publishing. Bump to a versioned dep
# before `cargo publish` per SHIPPING.md.
stonehm-macros = "0.2.1"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
